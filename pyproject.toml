[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boundarykit"
requires-python = ">=3.11"
version = "0.1.0"
description = "Build and export OpenStreetMap relation geometries"
dependencies = []

[project.scripts]
boundarykit = "boundarykit.cli:main"

[dependency-groups]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "pylint>=3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/boundarykit"]

[tool.black]
line-length = 80
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "google"
line_length = 80
src_paths = ["src", "tests"]
