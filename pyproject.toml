[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osm-geometry"
requires-python = ">=3.11"
version = "0.1.0"
description = "OSM geometry tools"
dependencies = []

[dependency-groups]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "pylint>=3.0.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 80
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "google"
line_length = 80
